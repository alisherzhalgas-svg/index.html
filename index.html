<!DOCTYPE html>

<html lang=“tr”>

<head>

  <meta charset=“UTF-8”>

  <meta name=“viewport” content=“width=device-width, initial-scale=1.0”>

  <title>İnternet ve Arayüz Tasarımı</title>

  <style>

    * {

      margin: 0;

      padding: 0;

      box-sizing: border-box;

    }

    body {

      background: #fff;

      color: #111;

      font-family: Arial, Helvetica, sans-serif;

      min-height: 100vh;

    }

    nav {

      height: 76px;

      padding: 0 6%;

      display: flex;

      align-items: center;

      justify-content: space-between;

      border-bottom: 1px solid #e8e8e8;

    }

    .mark {

      width: 24px;

      height: 24px;

      border: 2px solid #111;

      transform: rotate(45deg);

    }

    .nav-line {

      width: 42px;

      height: 1px;

      background: #111;

    }

    main {

      min-height: calc(100vh - 76px);

      padding: 8vh 8%;

      display: flex;

      flex-direction: column;

      justify-content: center;

      position: relative;

      overflow: hidden;

    }

    .number {

      width: 54px;

      height: 54px;

      border: 1px solid #111;

      border-radius: 50%;

      margin-bottom: 42px;

      display: grid;

      place-items: center;

      font-size: 13px;

    }

    h1 {

      font-size: clamp(42px, 8vw, 108px);

      line-height: 1.05;

      letter-spacing: -0.065em;

      font-weight: 500;

      max-width: 1000px;

      position: relative;

      z-index: 1;

    }

    .author {

      margin-top: 24px;

      font-size: 14px;

      letter-spacing: 0.04em;

      color: #777;

      position: relative;

      z-index: 1;

    }

    .bottom-line {

      margin-top: 64px;

      width: 100%;

      height: 1px;

      background: #dcdcdc;

    }

    .circle {

      position: absolute;

      width: 230px;

      height: 230px;

      border: 1px solid #ededed;

      border-radius: 50%;

      right: -75px;

      bottom: 90px;

    }

    .circle::after {

      content: “”;

      position: absolute;

      width: 150px;

      height: 150px;

      border: 1px solid #ededed;

      border-radius: 50%;

      top: 39px;

      left: -39px;

    }

    @media (max-width: 600px) {

      nav {

        height: 64px;

      }

      main {

        min-height: calc(100vh - 64px);

        padding: 8vh 7%;

      }

      h1 {

        font-size: clamp(42px, 11vw, 68px);

      }

      .number {

        margin-bottom: 32px;

      }

      .author {

        margin-top: 20px;

      }

      .bottom-line {

        margin-top: 48px;

      }

      .circle {

        width: 150px;

        height: 150px;

        bottom: 60px;

      }

      .circle::after {

        width: 95px;

        height: 95px;

        top: 27px;

        left: -25px;

      }

    }

  </style>

</head>

<body>

  <nav>

    <div class=“mark”></div>

    <div class=“nav-line”></div>

  </nav>

  <main>

    <h1>İnternet ve<br>Arayüz Tasarımı</h1>

    <p class=“author”>Alisher Zhalgas</p>

    <div class=“bottom-line”></div>

    <div class=“circle”></div>

  </main>

</body>

</html>
